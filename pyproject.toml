[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storm_lead_engine"
version = "0.1.0"
description = "Public NOAA MRMS hail swaths to ranked, explainable roof-inspection leads."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxwell Krehbiel" }]
keywords = ["hail", "noaa", "mrms", "geospatial", "bayesian", "lead-scoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "folium>=0.17",
]

[project.optional-dependencies]
mrms = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[project.urls]
Homepage = "https://github.com/maxskrehbiel/storm_lead_engine"
Repository = "https://github.com/maxskrehbiel/storm_lead_engine"
Issues = "https://github.com/maxskrehbiel/storm_lead_engine/issues"

[project.scripts]
storm_lead_engine = "storm_lead_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_lead_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: reads the public NOAA MRMS archive over the network; run with pytest -m integration",
]
filterwarnings = [
    # raised inside rasterio/affine, not by this package
    "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["storm_lead_engine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
